name: avn-connector

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - 'avn-connector/**'
  push:
    tags:
      - '**'

defaults:
  run:
    shell: bash

jobs:
  run-npm-pretty:
    name: Run npm pretty
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run npm pretty
        run: npm run pretty

  docker-connector:
    name: Build docker connector
    needs: run-npm-pretty
    uses: Aventus-Network-Services/shared-workflows/.github/workflows/docker-build.yaml@v5.17.0
    with:
      ecr_registry_type: public
      config_creds: false
      aws_region: us-east-1
      aws_account_id: 931945598683
      git_context: avn-connector
      ecr_repository_name: gateway/connector
      default_branch: main
      create_pr_dtag: ${{ startsWith(github.ref, 'refs/pull/') }}
      create_latest_dtag: ${{ github.ref == 'refs/heads/main' }}
      create_commit_hash_dtag: true
      create_git_ref_dtag: ${{ startsWith(github.ref, 'refs/tags/') }}
      docker_args_list: VERSION=${{ github.ref_name }}
    secrets: inherit
