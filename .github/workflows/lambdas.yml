name: avn-gateway

on:
  push:
    branches:
      - main
    paths:
      - 'avn-gateway/**'

env:
  AUTHORISER: authorisation-handler
  POLL: poll-handler
  SEND: send-handler
  QUERY: query-handler
  TX_STATUS: tx-status-update-handler
  LIFT_PROC: lift-processing-handler
  COMMON: common
  QUEUE: queue
  VOTE: vote-handler
  LOWER: lower-handler
  SPLIT_FEE: split-fee-handler
  TX_DISPATCH: tx-dispatch-handler
  INVALID_TRANSACTION: invalid-transaction-handler

defaults:
  run:
    shell: bash
    working-directory: avn-gateway

jobs:
  version-suffix:
    runs-on: ubuntu-latest
    name: Generate version suffix
    outputs:
      version: ${{ steps.suffix.outputs.version }}
    steps:
      - uses: actions/checkout@v2

      - name: Create github sha short version
        run: echo "VERSION_SUFFIX=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: output version suffix
        id: suffix
        run: echo ::set-output name=version::"${{ env.VERSION_SUFFIX }}"

  package:
    runs-on: ubuntu-latest
    name: package lambda functions
    needs: [version-suffix]
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_GATEWAY_ACTION_ID }}
          aws-secret-access-key: ${{ secrets.AWS_GATEWAY_ACTION_SECRET }}
          aws-region: eu-west-1

      - name: Package Function
        run: |
          SLS_ENV=sandbox make package version=${{ needs.version-suffix.outputs.version }}

      - name: create latest version
        run: |
          mv build/${{ env.POLL }}.zip build/${{ env.POLL }}/${{ env.POLL }}-latest.zip
          mv build/${{ env.SEND }}.zip build/${{ env.SEND }}/${{ env.SEND }}-latest.zip
          mv build/${{ env.QUERY }}.zip build/${{ env.QUERY }}/${{ env.QUERY }}-latest.zip
          mv build/${{ env.AUTHORISER }}.zip build/${{ env.AUTHORISER }}/${{ env.AUTHORISER }}-latest.zip
          mv build/${{ env.TX_STATUS }}.zip build/${{ env.TX_STATUS }}/${{ env.TX_STATUS }}-latest.zip
          mv build/${{ env.LIFT_PROC }}.zip build/${{ env.LIFT_PROC }}/${{ env.LIFT_PROC }}-latest.zip
          mv build/${{ env.COMMON }}.zip build/${{ env.COMMON }}/${{ env.COMMON }}-latest.zip
          mv build/${{ env.QUEUE }}.zip build/${{ env.QUEUE }}/${{ env.QUEUE }}-latest.zip
          mv build/${{ env.VOTE }}.zip build/${{ env.VOTE }}/${{ env.VOTE }}-latest.zip
          mv build/${{ env.LOWER }}.zip build/${{ env.LOWER }}/${{ env.LOWER }}-latest.zip
          mv build/${{ env.SPLIT_FEE }}.zip build/${{ env.SPLIT_FEE }}/${{ env.SPLIT_FEE }}-latest.zip
          mv build/${{ env.TX_DISPATCH }}.zip build/${{ env.TX_DISPATCH }}/${{ env.TX_DISPATCH }}-latest.zip
          mv build/${{ env.INVALID_TRANSACTION }}.zip build/${{ env.INVALID_TRANSACTION }}/${{ env.INVALID_TRANSACTION }}-latest.zip

          ls -l build/

      - name: create Short sha version
        run: |
          cp build/${{ env.POLL }}/${{ env.POLL }}-latest.zip build/${{ env.POLL }}/${{ env.POLL }}-${{ needs.version-suffix.outputs.version }}.zip
          cp build/${{ env.SEND }}/${{ env.SEND }}-latest.zip build/${{ env.SEND }}/${{ env.SEND }}-${{ needs.version-suffix.outputs.version }}.zip
          cp build/${{ env.QUERY }}/${{ env.QUERY }}-latest.zip build/${{ env.QUERY }}/${{ env.QUERY }}-${{ needs.version-suffix.outputs.version }}.zip
          cp build/${{ env.AUTHORISER }}/${{ env.AUTHORISER }}-latest.zip build/${{ env.AUTHORISER }}/${{ env.AUTHORISER }}-${{ needs.version-suffix.outputs.version }}.zip
          cp build/${{ env.TX_STATUS }}/${{ env.TX_STATUS }}-latest.zip build/${{ env.TX_STATUS }}/${{ env.TX_STATUS }}-${{ needs.version-suffix.outputs.version }}.zip
          cp build/${{ env.LIFT_PROC }}/${{ env.LIFT_PROC }}-latest.zip build/${{ env.LIFT_PROC }}/${{ env.LIFT_PROC }}-${{ needs.version-suffix.outputs.version }}.zip
          cp build/${{ env.COMMON }}/${{ env.COMMON }}-latest.zip build/${{ env.COMMON }}/${{ env.COMMON }}-${{ needs.version-suffix.outputs.version }}.zip
          cp build/${{ env.QUEUE }}/${{ env.QUEUE }}-latest.zip build/${{ env.QUEUE }}/${{ env.QUEUE }}-${{ needs.version-suffix.outputs.version }}.zip
          cp build/${{ env.VOTE }}/${{ env.VOTE }}-latest.zip build/${{ env.VOTE }}/${{ env.VOTE }}-${{ needs.version-suffix.outputs.version }}.zip
          cp build/${{ env.LOWER }}/${{ env.LOWER }}-latest.zip build/${{ env.LOWER }}/${{ env.LOWER }}-${{ needs.version-suffix.outputs.version }}.zip
          cp build/${{ env.SPLIT_FEE }}/${{ env.SPLIT_FEE }}-latest.zip build/${{ env.SPLIT_FEE }}/${{ env.SPLIT_FEE }}-${{ needs.version-suffix.outputs.version }}.zip
          cp build/${{ env.TX_DISPATCH }}/${{ env.TX_DISPATCH }}-latest.zip build/${{ env.TX_DISPATCH }}/${{ env.TX_DISPATCH }}-${{ needs.version-suffix.outputs.version }}.zip
          cp build/${{ env.INVALID_TRANSACTION }}/${{ env.INVALID_TRANSACTION }}-latest.zip build/${{ env.INVALID_TRANSACTION }}/${{ env.INVALID_TRANSACTION }}-${{ needs.version-suffix.outputs.version }}.zip

      - name: Upload to S3
        uses: jakejarvis/s3-sync-action@v0.5.1
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_ARTIFACT_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_GATEWAY_ACTION_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_GATEWAY_ACTION_SECRET }}
          AWS_REGION: 'eu-west-1'
          SOURCE_DIR: "avn-gateway/build"
