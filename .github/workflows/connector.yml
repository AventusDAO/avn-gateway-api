name: avn-connector

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - 'avn-connector/**'
  push:
    tags:
      - '**'

defaults:
  run:
    shell: bash

jobs:
  run-npm-pretty:
    name: Run npm pretty
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run npm pretty
        run: npm run pretty

  avn-docker-connector:
    name: (AVN) build docker connector
    needs: run-npm-pretty
    uses: ./.github/workflows/docker-build.yaml
    with:
      runner: avn-runner-ubuntu-2404-x64
      aws_region: eu-west-1
      aws_account_id: 931945598683
      context: avn-connector
      short_image_name: connector
      ecr_repository_prefix: gateway
