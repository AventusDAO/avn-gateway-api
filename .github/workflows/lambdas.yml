name: lambdas

on:
  pull_request:
    branches:
      - main
    paths:
      - 'lambdas/**'

env:
  AUTHORISER: authorisation-handler
  POLL: poll-handler
  SEND: send-handler
  QUERY: query-handler
  TX_STATUS: tx-status-update-handler
  LAYER: common-layer

defaults:
  run:
    shell: bash
    working-directory: lambdas

jobs:
  version-suffix:
    runs-on: ubuntu-latest
    name: Generate version suffix
    outputs:
      version: ${{ steps.suffix.outputs.version }}
    steps:
      - uses: actions/checkout@v2
        
      - name: Create github sha short version
        run: echo "VERSION_SUFFIX=${GITHUB_SHA::7}" >> $GITHUB_ENV
      
      - name: output version suffix
        id: suffix
        run: echo ::set-output name=version::"${{ env.VERSION_SUFFIX }}"

  package:
    runs-on: ubuntu-latest
    name: package lambda functions
    needs: [version-suffix]
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v2
        with:
          node-version: '14'
          cache: 'npm'
          cache-dependency-path: |
            lambdas/${{ env.POLL }}/package-lock.json
            lambdas/${{ env.SEND }}/package-lock.json
            lambdas/${{ env.QUERY }}/package-lock.json
            lambdas/${{ env.AUTHORISER }}/package-lock.json
            lambdas/${{ env.TX_STATUS }}/package-lock.json
            lambdas/layer/nodejs/package-lock.json
            lambdas/package-lock.json
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_GATEWAY_ACTION_ID }}
          aws-secret-access-key: ${{ secrets.AWS_GATEWAY_ACTION_SECRET }}
          aws-region: eu-west-1

      - name: Package Function
        run: |
          make package version=${{ needs.version-suffix.outputs.version }} name=${{ env.POLL }}
          make package version=${{ needs.version-suffix.outputs.version }} name=${{ env.SEND }}
          make package version=${{ needs.version-suffix.outputs.version }} name=${{ env.QUERY }}
          make package version=${{ needs.version-suffix.outputs.version }} name=${{ env.AUTHORISER }}
          make package version=${{ needs.version-suffix.outputs.version }} name=${{ env.TX_STATUS }}
          make package-layer version=${{ needs.version-suffix.outputs.version }} 
      
      - uses: actions/upload-artifact@master
        with:
          path: lambdas/build/
     
  upload:
    runs-on: ubuntu-latest
    name: upload functions to s3
    needs: [package]
    steps:
      - uses: actions/checkout@v2
      
      - uses: actions/download-artifact@master
        with:
          path: lambdas/build
      
      - run: |
          cp build/artifact/${{ env.POLL }}*.zip build/artifact/${{ env.POLL }}-latest.zip
          cp build/artifact/${{ env.SEND }}*.zip build/artifact/${{ env.SEND }}-latest.zip
          cp build/artifact/${{ env.QUERY }}*.zip build/artifact/${{ env.QUERY }}-latest.zip
          cp build/artifact/${{ env.AUTHORISER }}*.zip build/artifact/${{ env.AUTHORISER }}-latest.zip
          cp build/artifact/${{ env.TX_STATUS }}*.zip build/artifact/${{ env.TX_STATUS }}-latest.zip
          cp build/artifact/${{ env.LAYER }}*.zip build/artifact/${{ env.LAYER }}-latest.zip

      - name: Upload to S3
        uses: jakejarvis/s3-sync-action@v0.5.1
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_ARTIFACT_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_GATEWAY_ACTION_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_GATEWAY_ACTION_SECRET }}
          AWS_REGION: 'eu-west-1'
          SOURCE_DIR: "lambdas/build"
