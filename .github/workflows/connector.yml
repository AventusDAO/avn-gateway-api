name: avn-connector

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - parachain_main
      - feature/*
      - feat/*
    paths:
      - 'avn-connector/**'
  push:
    tags:
      - '**'

defaults:
  run:
    shell: bash

jobs:
  run-npm-pretty:
    name: Run npm pretty
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run npm pretty
        run: npm run pretty
  avn-docker-connector:
    name: (AVN) build docker connector
    needs: run-npm-pretty
    uses: ./.github/workflows/docker-build.yaml
    with:
      aws_region: eu-west-2
      aws_account_id: 189013141504
      context: avn-connector
      short_image_name: avn-connector
      ecr_repository_prefix: gateway-api
    secrets:
      aws_access_key: ${{ secrets.TESTNET_AWS_ACCESS_KEY_ID }}
      aws_secret_key: ${{ secrets.TESTNET_AWS_SECRET_ACCESS_KEY }}
