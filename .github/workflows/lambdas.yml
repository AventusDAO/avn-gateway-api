name: avn-gateway

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'avn-gateway/**'

defaults:
  run:
    shell: bash
    working-directory: avn-gateway

jobs:
  package:
    runs-on: ubuntu-latest
    name: package lambda functions
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Package Function
        run: make package version=${GITHUB_SHA::7}

      - name: Upload lambdas to cache
        uses: actions/upload-artifact@v3
        with:
          name: avn-gateway
          path: avn-gateway/build/

  upload-internal-tools:
    runs-on: avn-runner
    needs:  [package]
    name: Upload lambdas to AVN internal-tools s3 bucket
    steps:
    - uses: actions/download-artifact@v3
      with:
        name: avn-gateway
        path: avn-gateway/build/

    - name: Upload to S3
      run: |
        aws s3 sync build/. s3://aventus-internal-artefact/gateway-lambdas --acl bucket-owner-full-control

  upload-ew:
    runs-on: avn-runner
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' }}
    needs:  [package]
    name: Upload lambdas to EW s3 bucket
    steps:
    - uses: actions/download-artifact@v3
      with:
        name: avn-gateway
        path: avn-gateway/build/

    - name: Upload to S3
      run: |
        aws s3 sync build/. s3://ewx-internal-artefact/gateway-lambdas --acl bucket-owner-full-control

  cleanup-artifacts:
    runs-on: ubuntu-latest
    needs:  [ upload-internal-tools, upload-ew ]
    if: always()
    steps:
      - uses: geekyeggo/delete-artifact@v2
        with:
          name: avn-gateway