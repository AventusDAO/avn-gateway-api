apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    helmVersion: {{ .Chart.Version }}
  annotations:
  {{- if eq .Values.service.type "LoadBalancer" }}
    service.beta.kubernetes.io/aws-load-balancer-type: nlb-ip
    service.beta.kubernetes.io/aws-load-balancer-name: {{ .Chart.Name }}-{{ .Values.environment }}
    service.beta.kubernetes.io/aws-load-balancer-private-ipv4-addresses: "{{ join "," .Values.service.privateIps }}"
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-subnets: {{ join "," .Values.service.subnetIds }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: {{ .Chart.Name }}
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.deployment.server.port }}
    protocol: TCP
  selector:
    app: {{ .Chart.Name }}