name: avn-gateway

on:
  workflow_dispatch:
  push:
    tags:
      - '**'

defaults:
  run:
    shell: bash
    working-directory: avn-gateway

jobs:
  package:
    runs-on: arc-ubuntu-2404-x64
    name: package lambda functions
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v2
        with:
          node-version: '24'

      - name: Install make
        run: |
          sudo apt-get update
          sudo apt-get install -y make zip

      - name: Package Function manual build
        if: ${{ !startsWith(github.event.ref, 'refs/tags/v') }}
        run: make package version=${GITHUB_SHA::7}

      - name: Package Function release
        if: startsWith(github.event.ref, 'refs/tags/v')
        run: make package version=${GITHUB_REF#refs/*/}

      - name: Upload lambdas to cache
        uses: actions/upload-artifact@v4
        with:
          name: avn-gateway
          path: avn-gateway/build/
          retention-days: 1

  upload:
    runs-on: arc-ubuntu-2404-x64
    needs:  [ package ]
    name: Upload lambdas to AVN internal-tools s3 bucket
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: avn-gateway
        path: avn-gateway/build/

    - name: Install AWS CLI
      uses: unfor19/install-aws-cli-action@v1
      with:
        version: 2
        verbose: false
        arch: amd64

    - name: Upload to S3
      run: |
        aws s3 sync build/. s3://aventus-internal-artefact/gateway-lambdas --acl bucket-owner-full-control

  add-artifacts-to-gh-release:
    runs-on: ubuntu-latest
    needs: [ package ]
    if: startsWith(github.ref, 'refs/tags/v')
    name: Add artifacts to GitHub Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: avn-gateway
          path: avn-gateway/build/

      - name: Create GitHub release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: avn-gateway/build/**
