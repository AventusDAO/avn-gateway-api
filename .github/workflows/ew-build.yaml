name: Build and Deploy Energy Web

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  docker-connector:
    name: build docker connector
    uses: ./.github/workflows/docker-build.yaml
    with:
      runner: avn-runner
      config_creds: false
      aws_region: us-east-1
      aws_account_id: 541507968610
      context: avn-connector
      short_image_name: connector
      ecr_repository_prefix: gateway
  
  package:
    runs-on: ubuntu-latest
    name: package lambda functions
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Package Function release
        run: make package version=${GITHUB_REF#refs/*/}

      - name: Upload lambdas to cache
        uses: actions/upload-artifact@v3
        with:
          name: avn-gateway
          path: avn-gateway/build/

  upload:
    name: Upload lambdas to EW s3 bucket
    runs-on: avn-runner
    needs:  [package]
    steps:
    - uses: actions/download-artifact@v3
      with:
        name: avn-gateway
        path: avn-gateway/build/

    - name: Upload to S3
      run: |
        aws s3 sync build/. s3://ewx-internal-artefact/gateway-lambdas --acl bucket-owner-full-control

  cleanup-artifacts:
    runs-on: ubuntu-latest
    needs:  [upload]
    if: always()
    steps:
      - uses: geekyeggo/delete-artifact@v2
        with:
          name: avn-gateway
        
