apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    helmVersion: {{ .Chart.Version }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: {{ .Chart.Name }}
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.deployment.server.port }}
    protocol: TCP
  selector:
    app: {{ .Chart.Name }}