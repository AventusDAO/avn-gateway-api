ingress-nginx:
  controller:
    kind: DaemonSet
    
    service:
      external:
        enabled: false
      internal:
        enabled: true
        annotations:
          # Create internal ELB
          service.beta.kubernetes.io/aws-load-balancer-internal: "true"
          service.beta.kubernetes.io/aws-load-balancer-name: nginx-ingress-controller
