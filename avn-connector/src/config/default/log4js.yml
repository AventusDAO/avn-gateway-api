#
# Config for https://www.npmjs.com/package/log4js
# These settings are implicitly stored under the key which equals the filename (without extension).
#
levels:
  # Messages should be strict JSON-encoded objects - no free-text prefixes or suffixes!
  JSON:
    # greater than FATAL, so even min. level set to FATAL displays these messages -
    # presumably business events not related to log levels
    value: 51000
    colour: blue
categories:
  default:
    level: trace
    appenders:
      - console
      - file

appenders:
  console:
    type: console
    layout:
      type: pattern
      # ASCII colors in console
      pattern: %d{ISO8601} %[[%-5p]%] %m
  file:
    type: dateFile
    filename: log/avn-connector.log
    compress: true
    # 5Gb
    maxLogSize: 5000000000
    layout:
      type: pattern
      pattern: %d{ISO8601} [%-5p] %m