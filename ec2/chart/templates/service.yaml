apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    helmVersion: {{ .Chart.Version }}
  annotations:
  {{- if eq .Values.service.type "LoadBalancer" }}
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-private-ipv4-addresses: "172.17.0.20,172.17.4.20,172.17.8.20"
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-subnets: subnet-09293639cfe2a9a01,subnet-0032f8e1412a80472,subnet-0a4d2ee6f44747cac
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: {{ .Chart.Name }}
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.deployment.server.port }}
    protocol: TCP
  selector:
    app: {{ .Chart.Name }}