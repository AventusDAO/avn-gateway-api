apiVersion: "kubernetes-client.io/v1"
kind: ExternalSecret
metadata:
  name: mongo-credentials
spec:
  backendType: secretsManager
  data:
    - key: documentdb
      name: password
      property: password
    - key: documentdb
      name: username
      property: username
    - key: documentdb
      name: server
      property: server

---
apiVersion: "kubernetes-client.io/v1"
kind: ExternalSecret
metadata:
  name: rabbit-credentials
spec:
  backendType: secretsManager
  data:
    - key: rabbitmq
      name: server
      property: server

---
apiVersion: "kubernetes-client.io/v1"
kind: ExternalSecret
metadata:
  name: redis-credentials
spec:
  backendType: secretsManager
  data:
    - key: redis
      name: username
      property: username
    - key: redis
      name: password
      property: password

---
apiVersion: "kubernetes-client.io/v1"
kind: ExternalSecret
metadata:
  name: vault-role
spec:
  backendType: secretsManager
  data:
    - key: vault
      name: role-id
      property: role-id
    - key: vault
      name: secret-id
      property: secret-id
